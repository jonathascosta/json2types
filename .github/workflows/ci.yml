name: CI & deploy

# Pull requests are checked; pushes to main are checked and deployed to GitHub Pages.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Lint, type-check, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every Node line package.json's engines allows; the site is deployed from the .nvmrc one.
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Set up .NET
        if: matrix.node == 24
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The generated C# compiled and read back with real serializers; it doesn't depend on Node.
      - name: Test the C# with .NET
        if: matrix.node == 24
        run: npm run test:dotnet
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: 1

      - name: Build
        run: npm run build

      - name: Check the built page
        run: npm run check:dist

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main' && matrix.node == 24
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # The built site in a real browser: end-to-end tests (Playwright), accessibility checks (axe) and
  # Lighthouse scores, each against `vite preview` of the build, as GitHub Pages will serve it.
  quality:
    name: End-to-end, accessibility and Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Headless runs use Chromium's headless shell alone, a smaller download than full Chromium.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps --only-shell chromium

      - name: Build
        run: npm run build

      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      - name: Lighthouse
        run: npm run lighthouse

      # Also when a step timed out: that is when the reports matter most.
      - name: Upload reports
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          path: |
            playwright-report/
            test-results/
            lighthouse-report/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [check, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
